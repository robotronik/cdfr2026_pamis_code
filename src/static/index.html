<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Contrôle Servo via WebSocket</title>
  <style>
    body { font-family: sans-serif; text-align: center; }
    #joystick {
      width: 200px; height: 200px; border: 2px solid #444;
      border-radius: 50%; margin: 50px auto; position: relative;
      touch-action: none;
    }
    #stick {
      width: 60px; height: 60px; background: #444;
      border-radius: 50%; position: absolute; top: 70px; left: 70px;
      transition: left 0.02s, top 0.02s;
    }
  </style>
</head>
<body>
  <h1>Contrôle du Servo 1</h1>
  <input type="range" id="servo1" min="0" max="180" value="90">
  <p>Angle envoyé: <span id="angle1Value">90</span>°</p>

  <h1>Contrôle du Servo 2</h1>
  <input type="range" id="servo2" min="0" max="180" value="90">
  <p>Angle envoyé: <span id="angle2Value">90</span>°</p>

  <h1>Moteur</h1>
  <input type="range" id="moteurA" min="0" max="100" value="0">
  <input type="range" id="moteurB" min="0" max="100" value="0">

  <h1>Robot Joystick</h1>
  <div id="joystick"><div id="stick"></div></div>

  <h2>Retour ESP32</h2>
  <p>Servo 1 actuel: <span id="servo1Angle">--</span>°</p>
  <p>Servo 2 actuel: <span id="servo2Angle">--</span>°</p>
  <p>GPIO5: <span id="gpio5">--</span></p>

  <script>
    // ----- WebSocket auto-reconnect & safe send -----
    const WS_URL = "ws://" + location.hostname + ":8080";
    let ws = null;
    function connectWs() {
      ws = new WebSocket(WS_URL);
      ws.onopen = () => { console.log("WS open"); };
      ws.onmessage = (ev) => onWsMessage(ev.data);
      ws.onclose = () => { console.log("WS closed, reconnecting in 1s"); setTimeout(connectWs, 1000); };
      ws.onerror = (e) => { console.warn("WS error", e); ws.close(); };
    }
    function safeSend(msg) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(msg);
      }
    }
    connectWs();

    // ----- DOM refs -----
    const moteurASlider = document.getElementById("moteurA");
    const moteurBSlider = document.getElementById("moteurB");
    const angle1Slider = document.getElementById("servo1");
    const angle1Value = document.getElementById("angle1Value");
    const servo1Angle = document.getElementById("servo1Angle");
    const angle2Slider = document.getElementById("servo2");
    const angle2Value = document.getElementById("angle2Value");
    const servo2Angle = document.getElementById("servo2Angle");
    const gpio5 = document.getElementById("gpio5");

    // ----- handle server messages (JSON expected) -----
    function onWsMessage(dataStr) {
      try {
        const data = JSON.parse(dataStr);
        if (data.servo1 !== undefined) servo1Angle.textContent = data.servo1;
        if (data.servo2 !== undefined) servo2Angle.textContent = data.servo2;
        if (data.gpio5 !== undefined) gpio5.textContent = data.gpio5 ? "HIGH (1)" : "LOW (0)";
      } catch (e) {
        // not JSON — just log raw
        console.log("Non-JSON message:", dataStr);
      }
    }

    // ----- sliders: debounce (send at most after user stops for X ms) -----
    let sliderTimer1 = null;
    angle1Slider.addEventListener("input", () => {
      const angle = angle1Slider.value;
      angle1Value.textContent = angle;
      clearTimeout(sliderTimer1);
      sliderTimer1 = setTimeout(() => safeSend(`servo1=${angle}`), 60);
    });

    let sliderTimer2 = null;
    angle2Slider.addEventListener("input", () => {
      const angle = angle2Slider.value;
      angle2Value.textContent = angle;
      clearTimeout(sliderTimer2);
      sliderTimer2 = setTimeout(() => safeSend(`servo2=${angle}`), 60);
    });

    let motorATimer = null;
    moteurASlider.addEventListener("input", () => {
      const speed = moteurASlider.value;
      clearTimeout(motorATimer);
      motorATimer = setTimeout(() => safeSend(`moteurAspeed=${speed}`), 60);
    });

    let motorBTimer = null;
    moteurBSlider.addEventListener("input", () => {
      const speed = moteurBSlider.value;
      clearTimeout(motorBTimer);
      motorBTimer = setTimeout(() => safeSend(`moteurBspeed=${speed}`), 60);
    });

    // ----- joystick: throttle to ~30Hz -----
    const joystick = document.getElementById("joystick");
    const stick = document.getElementById("stick");
    const size = 200;
    const center = size / 2;
    let dragging = false;
    const SEND_INTERVAL_MS = 33; // ~30Hz
    let lastSent = 0;

    function sendMotorCommand(x, y) {
      const now = Date.now();
      if (now - lastSent < SEND_INTERVAL_MS && (x != 0 && y != 0)) return;
      lastSent = now;

      // Normalize x,y in -100..100 range (x = left/right, y = forward/back)
      const lx = Math.max(-100, Math.min(100, x));
      const ly = Math.max(-100, Math.min(100, y));

      // differential drive simple
      let left = Math.round(ly + lx);
      let right = Math.round(ly - lx);
      left = Math.max(-100, Math.min(100, left));
      right = Math.max(-100, Math.min(100, right));

      // send as text frames the server expects
      safeSend(`motor1=${left}`);
      safeSend(`motor2=${right}`);
    }

    joystick.addEventListener("pointerdown", (e) => {
      dragging = true;
      joystick.setPointerCapture(e.pointerId);
      e.preventDefault();
    });

    joystick.addEventListener("pointerup", (e) => {
      dragging = false;
      try { joystick.releasePointerCapture(e.pointerId); } catch(_) {}
      // center stick visually
      stick.style.left = `${center - 30}px`;
      stick.style.top = `${center - 30}px`;
      sendMotorCommand(0, 0);
      e.preventDefault();
    });

    joystick.addEventListener("pointercancel", (e) => {
      dragging = false;
      try { joystick.releasePointerCapture(e.pointerId); } catch(_) {}
      stick.style.left = `${center - 30}px`;
      stick.style.top = `${center - 30}px`;
      sendMotorCommand(0, 0);
    });

    joystick.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      const rect = joystick.getBoundingClientRect();
      const x = e.clientX - rect.left - center;
      const y = e.clientY - rect.top - center;
      const dist = Math.min(center, Math.sqrt(x*x + y*y));
      const angle = Math.atan2(y, x);
      const dx = dist * Math.cos(angle);
      const dy = dist * Math.sin(angle);

      stick.style.left = `${center + dx - 30}px`;
      stick.style.top = `${center + dy - 30}px`;

      // y inverted so up = forward
      sendMotorCommand(dx, -dy);
      e.preventDefault();
    });

    // center initial position
    stick.style.left = `${center - 30}px`;
    stick.style.top = `${center - 30}px`;
  </script>
</body>
</html>
